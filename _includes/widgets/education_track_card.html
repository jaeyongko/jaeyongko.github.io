<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <div class="row">
                    <div class="col-12">
                        <div class="mx-2 my-1">
                            <h6>Educational Publications</h6>
                            <ul class="list-unstyled mb-1">
                                {% for item in site.data.education_track %}
                                <li class="media mb-1">
                                    <div class="media-body">
                                        <div>{{ item.title }}</div>
                                        <div class="small">{% include widgets/author_list.html authors=item.authors %}</div>
                                        <div class="small"><i>{{ item.venue }}</i></div>
                                    </div>
                                </li>
                                {% endfor %}
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
