- title: "Can a model think VISUALLY?"
  authors:
    - Jaeyong Ko
    - Eunseo Kim
    - Doehyeon Lee
  venue: "NeurIPS 2026 Education Track (Accepted)"
  description:
    - >-
      A visual lecture and hands-on Janus-Pro-1B Colab lab explore text-only,
      visual-only, and interleaved reasoning. The resource compares unified
      multimodal models across understanding and generation, computation
      sharing, shared visual context, and learning synergy.

- title: "AI Safety Lives in a Direction: Reading, Breaking, and Repairing Refusal in Multimodal Models"
  authors:
    - Doehyeon Lee
    - Yoo-Min Jung
    - Jaeyong Ko
  venue: "NeurIPS 2026 Education Track (Accepted)"
  description:
    - >-
      Introduces AI safety and safety-direction detection, a method for
      identifying safety-related behavior.
