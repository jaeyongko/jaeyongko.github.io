- title: "Can a model think VISUALLY?"
  authors:
    - Jaeyong Ko
    - Eunseo Kim
    - Doehyeon Lee
  venue: "NeurIPS 2026 Education Track (Accepted)"
  description:
    - >-
      A visual lecture and hands-on lab compare text-only, visual-only, and
      interleaved reasoning across four dimensions of unified multimodal models.

- title: "AI Safety Lives in a Direction: Reading, Breaking, and Repairing Refusal in Multimodal Models"
  authors:
    - Doehyeon Lee
    - Yoo-Min Jung
    - Jaeyong Ko
  venue: "NeurIPS 2026 Education Track (Accepted)"
  description:
    - >-
      An interactive lecture and lab explore a safety direction in
      vision-language models by detecting, bypassing, and restoring refusal
      with projection and activation addition.
